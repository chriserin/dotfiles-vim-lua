# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  install:
    desc: Install Claude Code configuration
    summary: |
      Symlinks config/claude/hooks/nvim-socket-open.sh into ~/.claude/hooks,
      and merges config/claude/settings.json's hooks into
      ~/.claude/settings.json.

      ~/.claude/settings.json can't be a straight symlink to the repo: it's
      a real file other installers (config/agent-guard/install.sh) and
      Claude Code itself write personal/local fields into.
      config/claude/install.sh merges this tool's hooks in without
      disturbing that other content, the same way
      config/agent-guard/install.sh merges its own hook in.
    cmds:
      - ./config/claude/install.sh

  sync:
    desc: Synchronize Claude Code configuration
    cmds:
      - task: install
